name: Industrial brief verification
on:
  push:
    branches: [main]
    paths:
      - 'industrial-factory/finalize_site.py'
      - 'industrial-factory/verify_site.py'
      - '.github/workflows/industrial-review.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: industrial-brief-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: |
          pip install requests pillow playwright
          playwright install --with-deps chromium
      - name: Finalize verified photo selection
        run: python industrial-factory/finalize_site.py
      - name: Save reviewed public site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add industrial-factory/index.html industrial-factory/photos.json industrial-factory/photos
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize verified listing photos and distinguish area imagery'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds
          sleep 30
      - name: Verify desktop and mobile site
        run: python industrial-factory/verify_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-site-reviewed
          path: |
            industrial-factory/index.html
            industrial-factory/photos.json
            industrial-factory/photos
            industrial-factory/qa
          retention-days: 3
