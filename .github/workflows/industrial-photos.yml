name: Industrial listing photo preparation
on:
  push:
    branches: [main]
    paths:
      - 'industrial-factory/fetch_photos.py'
      - '.github/workflows/industrial-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: industrial-listing-photos
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image parsing dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Collect public source photos
        run: python industrial-factory/fetch_photos.py
      - name: Save photos and attribution manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add industrial-factory/photos industrial-factory/photos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add industrial listing photos with original source attribution'
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-photo-review
          path: |
            industrial-factory/photos
            industrial-factory/photos.json
          retention-days: 3
