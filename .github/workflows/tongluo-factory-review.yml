name: Tongluo property photo and page review
on:
  push:
    branches: [main]
    paths:
      - 'tongluo-factory/index.html'
      - 'tongluo-factory/verify.py'
      - '.github/workflows/tongluo-factory-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tongluo-property-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          pip install requests pillow playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Preserve original photographs and check property page
        run: python tongluo-factory/verify.py
      - name: Commit only this property page and its verified assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tongluo-factory/index.html tongluo-factory/photos tongluo-factory/review
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve four original Tongluo photos and verify responsive property page'
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tongluo-property-review
          path: |
            tongluo-factory/index.html
            tongluo-factory/review
            tongluo-factory/photos
          retention-days: 5
